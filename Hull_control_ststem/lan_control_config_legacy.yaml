# LAN 导航备案配置（原 lan_control_hull 行为，与 cli_gps 档案区分保存）
#
# 用法:
#   python lan_control_hull.py --legacy
#   python lan_control_hull.py --config lan_control_config_legacy.yaml

listen:
  host: "0.0.0.0"
  port: 9000

report:
  interval: 0.5

hardware:
  compass_port: "/dev/ttyS0"
  gps_port: "/dev/ttyS1"
  gps_baudrate: 115200

navigation:
  profile: lan_legacy
  arrival_threshold: 5.0
  base_speed: 70
  motor_driver: "uart3"
  esc_auto_unlock: true
  straight_threshold_deg: 10.0
  gear_hysteresis_deg: 2.0
  heading_gears:
    - { max_error_deg: 30, left: 0.5,  right: 1.0,  label: "1档·双前进", mode: forward_diff }
    - { max_error_deg: 50, left: -0.5, right: 0.5,  label: "2档·50%",    mode: spin }
    - { max_error_deg: 70, left: -0.7, right: 0.7,  label: "3档·70%",    mode: spin }
    - { max_error_deg: 90, left: -0.9, right: 0.9,  label: "4档·90%",    mode: spin }
    - { max_error_deg: 9999, left: -1.0, right: 1.0, label: "5档·满转",   mode: spin }
  deviation_threshold: 10.0
  compass_mode: auto_50hz
  use_heading_wrap: true
  uart_port: "/dev/ttyUSB1"
  uart_baud: 115200
  calibration_duration: 2.0
  use_forward_heading_calibration: true
  bearing_recompute_interval: 0.0
  run_duration_sec: 0
  post_arrival_reverse_sec: 7
  # post_arrival_reverse_speed: 90
  uart_debug_tx: false
