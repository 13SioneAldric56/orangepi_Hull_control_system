# 船体端局域网控制配置（船在 241 上监听，手机连入）
#
# navigation.profile:
#   cli_gps    — 与本地 python heading_lock_control.py --gps 一致（默认）
#   lan_legacy — 原 LAN 行为备案（到达后后退 5s、deviation_threshold=5 等）
#
# 启用备案: python lan_control_hull.py --legacy
# 或指定:   python lan_control_hull.py --config lan_control_config_legacy.yaml

listen:
  host: "0.0.0.0"
  port: 9000

report:
  interval: 0.5

hardware:
  compass_port: "/dev/ttyS0"
  gps_port: "/dev/ttyS1"
  gps_baudrate: 115200

navigation:
  profile: cli_gps
  arrival_threshold: 5.0
  base_speed: 70
  motor_driver: "uart3"
  esc_auto_unlock: true
  pid_kp: 0.8
  pid_ki: 0.1
  pid_kd: 1.5
  max_turn_strength: 0.2
  deviation_threshold: 10.0
  pid_p_full_scale_deg: 25
  compass_mode: auto_50hz
  use_heading_wrap: true
  uart_port: "/dev/ttyUSB1"
  uart_baud: 115200
  calibration_duration: 2.0
  use_forward_heading_calibration: true
  bearing_recompute_interval: 0.0
  run_duration_sec: 0
  post_arrival_reverse_sec: 0
  # post_arrival_reverse_speed: 90
  # uart_debug_tx: false
  # confirm_interactive: false
